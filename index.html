<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food Web</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
*{box-sizing:border-box;}

body{
  margin:0;
  background:#0f0f12;
  font-family:Arial, Helvetica, sans-serif;
  color:#fff;
  overflow:hidden;
}

/* ===== MAP ===== */
#map{
  position:fixed;
  inset:0;
  z-index:0;
}

/* ===== HERO ===== */
.hero{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  backdrop-filter:blur(12px);
  background:rgba(0,0,0,0.55);
  z-index:2;
  transition:opacity .6s ease;
}

.hero.hide{
  opacity:0;
  pointer-events:none;
}

/* CARD */
.hero-box{
  max-width:480px;
  padding:40px 46px;
  text-align:center;
  background:rgba(20,20,27,.65);
  backdrop-filter:blur(12px);
  border-radius:24px;
  box-shadow:0 0 70px rgba(0,0,0,.75);
  animation:fadeIn .8s ease;
}

.hero-box h1{
  margin:0 0 14px;
  font-size:36px;
}

.hero-box p{
  color:#bbb;
  line-height:1.6;
}

button{
  margin-top:20px;
  padding:14px 22px;
  border:none;
  border-radius:10px;
  font-size:16px;
  background:#2b2b38;
  color:#fff;
  cursor:pointer;
  transition:.2s;
}

button:hover{
  background:#3a3a4f;
}

/* radius info */
.info{
  position:absolute;
  top:20px;
  left:20px;
  background:rgba(20,20,27,.75);
  padding:12px 18px;
  border-radius:12px;
  z-index:1;
  backdrop-filter:blur(10px);
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:none;}
}
</style>
</head>
<body>

<div id="map"></div>

<!-- HERO -->
<div class="hero" id="hero">
  <div class="hero-box">
    <h1>Food Web</h1>
    <p>
      Temukan penjual makanan di sekitar kamu secara realtime.
      Klik tombol di bawah untuk mulai mencari makanan terdekat.
    </p>
    <button onclick="startFood()">Find Food Near Me</button>
  </div>
</div>

<div class="info" id="info" style="display:none">
  Menampilkan makanan dalam radius 500m
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const vendors = [
  {name:"Bakso Pak Dedi", lat:-6.812, lng:107.61},
  {name:"Nasi Goreng Malam", lat:-6.814, lng:107.615},
  {name:"Es Teh Jumbo", lat:-6.810, lng:107.613}
];

const map = L.map('map').setView([-6.81, 107.61], 15);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom:19
}).addTo(map);

let userMarker;
let radiusCircle;

vendors.forEach(v=>{
  L.marker([v.lat, v.lng])
    .addTo(map)
    .bindPopup(v.name);
});

function startFood(){
  navigator.geolocation.getCurrentPosition(pos=>{

    const lat = pos.coords.latitude;
    const lng = pos.coords.longitude;

    document.getElementById("hero").classList.add("hide");
    document.getElementById("info").style.display="block";

    if(userMarker) map.removeLayer(userMarker);
    if(radiusCircle) map.removeLayer(radiusCircle);

    userMarker = L.marker([lat,lng])
      .addTo(map)
      .bindPopup("You are here")
      .openPopup();

    radiusCircle = L.circle([lat,lng], {
      radius:500
    }).addTo(map);

    map.setView([lat,lng], 16);

  }, ()=>{
    alert("Location permission needed");
  });
}
</script>

</body>
</html>
